# MySoc platform updater — production configuration (cascade tier 1)
#
# This node is the ONLY tier that talks to updates.mysoc.ai. It authenticates
# with the operator's platform license key and relays updates + telemetry for
# every siemcore (and their swf agents) beneath it.

server:
  url: https://updates.mysoc.ai
  # The operator platform key issued on the Operators page (shown once).
  license_key: "PASTE-PLATFORM-KEY"
  timeout: 30s

instance:
  # Stable unique id for this platform node, e.g. mysoc-<operator-id>.
  id: mysoc-CHANGE-ME
  type: server
  product_tier: mysoc
  hostname: ""            # defaults to the OS hostname when empty
  updater_version: "@VERSION@"

signing:
  # Pin the release-signing public key at provisioning time:
  #   curl -s https://updates.mysoc.ai/api/v1/signing-key
  public_key: "PASTE-HEX-PUBLIC-KEY"
  require: true

relay:
  enabled: true
  # Child-facing listener; siemcore updaters point their server.url here
  # (https:// — the listener is TLS-only). Binds at updater start (even in
  # simulate mode). :18443 is the ONE relay port across the whole cascade
  # (mysoc and siemcore tiers alike) — the port protects itself (rate
  # limits, auth-failure bans, learned-source restriction), so it can be
  # opened broadly; children never configure firewalls.
  listen: ":18443"
  cache_dir: /var/lib/mysoc-updater/relay-cache
  child_offline_after: 5m
  tls:
    # The relay self-provisions a long-lived self-signed certificate under
    # dir on first start; give its cert.pem to every child operator to pin
    # via server.ca_file. List every DNS name / IP children use to reach
    # this relay — changing the list regenerates the certificate.
    hosts: []          # e.g. ["mysoc.example.internal", "10.0.1.20"]
    dir: /var/lib/mysoc-updater/relay-tls
    # Or provide your own PEM material instead (set both):
    # cert_file: /etc/mysoc-updater/relay.crt
    # key_file: /etc/mysoc-updater/relay.key

heartbeat:
  interval: 60s
  jitter: 10s

# The updater keeps ITSELF updated from the cascade (on by default): each
# cycle it also checks for the product "updater-<os>-<arch>" using the running
# binary's stamped version. Offers are signature-verified, staged, validated
# (the candidate must execute and report the offered version), then activated
# with an atomic symlink swap and a service restart. Requires the install
# layout created by install.sh; a kit reinstall re-arms it if broken.
# self_update:
#   disabled: true      # opt out of updater self-updates
#   channel: stable

simulation:
  # "real" runs the full pipeline: verify signature + checksum, download,
  # run the executor, report the result upstream. Without the executor block
  # below, offered updates are FAILED loudly (visible on the dashboard) —
  # the updater never reports a success that did not happen. (The retired
  # name "simulate" is still accepted as a deprecated alias of real.)
  mode: real
  artifact_dir: /var/lib/mysoc-updater/artifacts
  state_file: /var/lib/mysoc-updater/state.json
  # PRODUCTION INSTALLS: uncomment to perform real versioned installs with
  # atomic activation and automatic rollback. The proven pattern (running on
  # testing.mysoc.ai since 1.3.12.9): the executor stages releases under its
  # own install_root, and a root-owned apply wrapper (deploy/mysoc-apply-update.sh,
  # invoked via a single NOPASSWD sudoers entry) syncs code into the live app
  # layout, restarts services, and health-gates. The updater unit also needs
  # NoNewPrivileges=no and ProtectSystem=no (sudo inherits the unit's mount
  # namespace — see deploy/flip-testing-executor.sh).
  # Commands receive the lifecycle phase (apply/rollback/health) as a trailing
  # argument and as UPDATER_PHASE; artifacts may ship their own updater/apply
  # entrypoint — see docs/UPDATE-ENTRYPOINT-CONTRACT.md.
  # executor: filesystem
  # filesystem:
  #   install_root: /opt/mysoc-cascade
  #   restart_command: ["sudo", "/usr/local/sbin/mysoc-apply-update"]
  #   # NOTE: since 1.9.1 every command receives the lifecycle phase as a
  #   # trailing argument; a bare curl would treat that token as a second
  #   # URL and fail. Wrap probes in bash -c (the extra argument lands in
  #   # $0 and is ignored).
  #   health_command: ["bash", "-c", "curl -fsS http://127.0.0.1:8080/health"]
  #   keep_releases: 3
  #   command_timeout: 300s

products:
  - name: mysoc
    # Set to the version actually installed on this host BEFORE first start —
    # do not leave 0.0.0.
    current_version: "0.0.0"
    channel: stable
