# SiemCore cascade updater — production configuration (cascade tier 2)
#
# This node never talks to updates.mysoc.ai. It heartbeats to the operator's
# mysoc relay, installs siemcore updates served from the relay's verified
# cache, and relays updates + telemetry for the swf agents beneath it.

server:
  # The mysoc relay's child-facing address (relay.listen on the mysoc node).
  url: http://mysoc.example.internal:8443
  # SiemCore enrollment credential agreed with the operator (any stable
  # secret string; it is bound to a relay_token at first contact).
  license_key: "CHANGE-ME-SIEMCORE-CREDENTIAL"
  timeout: 30s

instance:
  # Stable unique id for this siemcore server.
  id: siemcore-CHANGE-ME
  type: server
  product_tier: siemcore
  # instance.id of the mysoc node this siemcore belongs to.
  parent_id: mysoc-CHANGE-ME
  # End customer this siemcore serves; flows up the cascade for fleet views.
  customer_id: customer-CHANGE-ME
  customer_name: "Customer Name"
  hostname: ""            # defaults to the OS hostname when empty
  updater_version: "@VERSION@"

signing:
  # Same pinned key as the whole fleet:
  #   curl -s https://updates.mysoc.ai/api/v1/signing-key
  public_key: "PASTE-HEX-PUBLIC-KEY"
  require: true

relay:
  enabled: true
  # Child-facing listener; swf updaters point their server.url here.
  # NOTE: this binds at updater start (even in simulate mode, before any swf
  # enrolls). v3 siemcore hosts already publish the app on :8443, so the
  # default here is :18443 to avoid the collision.
  listen: ":18443"
  cache_dir: /var/lib/siemcore-cascade-updater/relay-cache
  child_offline_after: 5m

heartbeat:
  interval: 60s
  jitter: 10s

# The updater keeps ITSELF updated from the cascade (on by default): each
# cycle it also checks the mysoc relay for the product "updater-<os>-<arch>"
# using the running binary's stamped version. Offers are signature-verified,
# staged, validated (the candidate must execute and report the offered
# version), then activated with an atomic symlink swap and a service restart.
# Requires the install layout created by install.sh. This is independent of
# simulation.mode — the updater manages its own binary even while product
# installs stay simulate-only.
# self_update:
#   disabled: true      # opt out of updater self-updates
#   channel: stable

simulation:
  # "simulate" runs the full pipeline: verify signature + checksum, download,
  # run the executor, report the result upstream.
  mode: simulate
  artifact_dir: /var/lib/siemcore-cascade-updater/artifacts
  state_file: /var/lib/siemcore-cascade-updater/state.json
  # PRODUCTION INSTALLS — v3 compose contract (DRAFT, do not enable until the
  # siemcore team confirms the exact commands for their v3 hosts; the old
  # v2 sample of `systemctl restart siemcore` + health on :9000 is obsolete).
  # The updater stays simulate-only until this block is agreed and tested.
  # executor: filesystem
  # filesystem:
  #   install_root: /opt/siemcore
  #   # v3 hosts deploy via compose; deploy.sh reads SIEMCORE_HOST_PORT etc.
  #   restart_command: ["bash", "-lc", "cd /opt/siemcore && ./deploy.sh"]
  #   health_command: ["curl", "-fsS", "http://127.0.0.1:8443/health"]
  #   keep_releases: 3

products:
  - name: siemcore
    current_version: "0.0.0"   # set to the currently installed siemcore version
    channel: stable
