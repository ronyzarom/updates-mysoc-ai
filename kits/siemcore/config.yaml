# SiemCore cascade updater — production configuration (cascade tier 2)
#
# This node never talks to updates.mysoc.ai. It heartbeats to the operator's
# mysoc relay, installs siemcore updates served from the relay's verified
# cache, and relays updates + telemetry for the swf agents beneath it.

server:
  # The mysoc relay's child-facing address (relay.listen on the mysoc node).
  # The relay listener is TLS-only: use https:// and pin its certificate.
  url: https://mysoc.example.internal:18443
  # The mysoc relay's cert.pem (from its relay.tls dir) — get it from the
  # mysoc operator and install it beside this config.
  ca_file: mysoc-relay-ca.pem
  # SiemCore enrollment credential agreed with the operator (any stable
  # secret string; it is bound to a relay_token at first contact).
  license_key: "CHANGE-ME-SIEMCORE-CREDENTIAL"
  timeout: 30s

instance:
  # Stable unique id for this siemcore server.
  id: siemcore-CHANGE-ME
  type: server
  product_tier: siemcore
  # instance.id of the mysoc node this siemcore belongs to.
  parent_id: mysoc-CHANGE-ME
  # End customer this siemcore serves; flows up the cascade for fleet views.
  customer_id: customer-CHANGE-ME
  customer_name: "Customer Name"
  hostname: ""            # defaults to the OS hostname when empty
  updater_version: "@VERSION@"

signing:
  # Same pinned key as the whole fleet:
  #   curl -s https://updates.mysoc.ai/api/v1/signing-key
  public_key: "PASTE-HEX-PUBLIC-KEY"
  require: true

relay:
  enabled: true
  # Child-facing listener; swf updaters point their server.url here
  # (https:// — the listener is TLS-only). NOTE: this binds at updater start
  # (even in simulate mode, before any swf enrolls). :18443 is the ONE relay
  # port across the whole cascade — the port protects itself (rate limits,
  # auth-failure bans, learned-source restriction), so it can be opened
  # broadly; children never configure firewalls.
  listen: ":18443"
  cache_dir: /var/lib/siemcore-cascade-updater/relay-cache
  child_offline_after: 5m
  tls:
    # The relay self-provisions a long-lived self-signed certificate under
    # dir on first start; give its cert.pem to the swf team so their agents
    # can pin it. List every DNS name / IP swf agents use to reach this
    # host — changing the list regenerates the certificate.
    hosts: []          # e.g. ["siemcore01.customer.internal", "10.0.2.30"]
    dir: /var/lib/siemcore-cascade-updater/relay-tls
    # Or provide your own PEM material instead (set both):
    # cert_file: /etc/siemcore-cascade-updater/relay.crt
    # key_file: /etc/siemcore-cascade-updater/relay.key

heartbeat:
  interval: 60s
  jitter: 10s

# The updater keeps ITSELF updated from the cascade (on by default): each
# cycle it also checks the mysoc relay for the product "updater-<os>-<arch>"
# using the running binary's stamped version. Offers are signature-verified,
# staged, validated (the candidate must execute and report the offered
# version), then activated with an atomic symlink swap and a service restart.
# Requires the install layout created by install.sh. This is independent of
# simulation.mode — the updater manages its own binary even while product
# installs are not yet wired to an executor.
# self_update:
#   disabled: true      # opt out of updater self-updates
#   channel: stable
#   timeout: 10m        # (1.18.0) whole self-update phase budget; it runs first
#                       # and in isolation, so a wedged product never starves it.

# Survivability bounds (1.18.0). All optional; shown with their defaults. A
# config without them behaves exactly as these values.
# signing:
#   # Trust more than one key during a signing-key rotation so a re-keyed
#   # release never strands this node (any listed key may verify an artifact):
#   public_keys:
#     - "PRIMARY-HEX-PUBLIC-KEY"
#     - "ROTATED-IN-HEX-PUBLIC-KEY"
# server:
#   download_timeout: 30m        # whole-artifact download budget (not metadata)
#   download_stall_timeout: 2m   # abort a download that makes no progress
#   # fallback_url is TIER-1 ONLY (a node that holds an origin credential). A
#   # relay child must NOT set it — its parent is the relay, not the origin.
# simulation:
#   cycle_timeout: 60m    # a stuck cycle self-cancels instead of starving ticks
#   product_timeout: 40m  # per-product budget within a cycle
#   filesystem:
#     # The only outage an update may cause is the restart window; exceeding this
#     # flags the report (never aborts the apply) and blocks ring promotion.
#     max_unavailable_seconds: 120
# relay:
#   drain_timeout: 2m     # on shutdown, finish in-flight child downloads, refuse
#                         # new ones (503 + Retry-After), then close.

simulation:
  # "real" runs the full pipeline: verify signature + checksum, download,
  # run the executor, report the result upstream. Without the executor block
  # below, offered updates are FAILED loudly (visible on the dashboard) —
  # the updater never reports a success that did not happen. (The retired
  # name "simulate" is still accepted as a deprecated alias of real.)
  mode: real
  artifact_dir: /var/lib/siemcore-cascade-updater/artifacts
  state_file: /var/lib/siemcore-cascade-updater/state.json
  # PRODUCTION INSTALLS — v3 compose contract (FINAL, confirmed by the
  # siemcore team and proven on production-track releases 3.3.132.1 and
  # 3.3.133.1). Canonical copies of this block and the host shim live in the
  # siemcore repo under deploy/cascade/ and docs/operations/cascade-updater.md.
  # Commands receive the lifecycle phase (apply/rollback/health) as a trailing
  # argument and as UPDATER_PHASE (the shim's sudoers entry permits exactly
  # the phase invocations and deliberately ignores the environment);
  # artifacts may ship their own updater/apply entrypoint — see the bundled
  # UPDATE-ENTRYPOINT-CONTRACT.md.
  # To enable real installs: install the host shim + sudoers entry from the
  # siemcore repo and uncomment:
  # executor: filesystem
  # filesystem:
  #   install_root: /opt/siemcore
  #   restart_command: ["sudo", "-n", "/usr/local/sbin/siemcore-apply-update"]
  #   # Version-matching health gate on :8443/health/live — copy the exact
  #   # proven command from the siemcore repo (deploy/cascade/). Keep the
  #   # bash -c form: since 1.9.1 every command receives the lifecycle
  #   # phase as a trailing argument, which bash -c absorbs (it lands in
  #   # $0); a bare curl would treat it as a second URL and fail.
  #   health_command: ["bash", "-c", "curl -fsS http://127.0.0.1:8443/health/live"]
  #   command_timeout: 15m
  #   keep_releases: 3

products:
  - name: siemcore
    current_version: "0.0.0"   # set to the currently installed siemcore version
    channel: stable
