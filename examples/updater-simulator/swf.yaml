# Safe observe-only SWF simulator (leaf tier).
#
# Product hierarchy: mysoc > siemcore > swf. This node reports tier=swf and its
# parent_id points at a siemcore instance. Use the SAME customer license as the
# mysoc/siemcore configs (one license spans the whole tree) via
# UPDATER_SIM_LICENSE_KEY.
server:
  url: https://updates.mysoc.ai
  license_key: "" # shared customer license; prefer UPDATER_SIM_LICENSE_KEY
  api_key: ""
  timeout: 30s
  max_response_bytes: 1048576
  allow_external_downloads: false

instance:
  id: sim-swf-dev-01
  type: swf-windows # OS/sub-type; product_tier below is the canonical tier
  hostname: sim-swf-dev-01
  machine_id: sim-swf-dev-01
  updater_version: updater-simulator/1.1.0.3
  os: windows
  arch: amd64
  product_tier: swf
  parent_id: sim-siemcore-dev-01 # the parent siemcore node's instance id

heartbeat:
  interval: 60s
  jitter: 5s

simulation:
  mode: observe
  artifact_dir: ./artifacts
  state_file: ./.swf-simulator-state.json
  max_download_bytes: 1073741824
  legacy_fallback: false

products:
  - name: swf
    current_version: 0.0.0
    channel: stable
