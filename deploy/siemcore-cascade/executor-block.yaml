  # SiemCore filesystem-executor block — spliced into config.yaml (under the
  # top-level `simulation:` key, between the #BEGIN/#END-FS-EXECUTOR markers) by
  # `install.sh --executor filesystem`. Authored at the 2-space indent it must
  # sit at under `simulation:`.
  #
  # PLACEHOLDER (updates-mysoc version/1.18.1). The AUTHORITATIVE, first_install-
  # capable block is SiemCore-owned (siemcore repo deploy/cascade/
  # executor-block.yaml, from release/v3.3.198); updates-mysoc replaces this file
  # and its pinned SHA-256 with SiemCore's bytes before publishing.
  executor: filesystem
  filesystem:
    install_root: /opt/siemcore-cascade
    restart_command: ["sudo", "-n", "/usr/local/sbin/siemcore-apply-update"]
    # Version-matching health gate on :8443/health/live. Keep the bash -c form:
    # every command receives the lifecycle phase as a trailing argument, which
    # bash -c absorbs (it lands in $0); a bare curl would treat it as a second
    # URL and fail.
    health_command: ["bash", "-c", "curl -fsS http://127.0.0.1:8443/health/live"]
    command_timeout: 15m
    first_install_timeout: 30m
    keep_releases: 3
