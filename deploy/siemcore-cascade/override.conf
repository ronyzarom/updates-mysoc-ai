# siemcore-cascade-updater systemd unit drop-in — installed to
# /etc/systemd/system/siemcore-cascade-updater.service.d/override.conf by
# `install.sh --executor filesystem`.
#
# PLACEHOLDER (updates-mysoc version/1.18.1). The AUTHORITATIVE drop-in is
# SiemCore-owned (siemcore repo deploy/cascade/override.conf, first_install-
# capable, from release/v3.3.198); updates-mysoc replaces this file and its
# pinned SHA-256 with SiemCore's bytes before publishing.
#
# The executor must sudo the apply shim, so NoNewPrivileges must be off;
# ProtectSystem is relaxed and the install tree is granted as a ReadWritePath
# so the shim can stage releases + flip the current symlink. ProtectHome stays
# at its unit default (yes) — the bootstrap copies credentials out of /root.
[Service]
NoNewPrivileges=false
ProtectSystem=no
ReadWritePaths=/opt/siemcore-cascade
