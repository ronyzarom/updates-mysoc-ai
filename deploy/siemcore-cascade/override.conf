# Cascade executor drop-in.
#
# The restart hook escalates through sudo (one NOPASSWD command; see
# /etc/sudoers.d/siemcore-cascade-updater), which NoNewPrivileges would block.
#
# ProtectSystem must be OFF for this unit: sudo escalates uid but does NOT
# escape the unit's mount namespace, so with ProtectSystem=strict even the
# root-side wrapper sees a read-only filesystem and update.sh cannot write
# /opt/siemcore-app-app-a (verified live 2026-08-21: ".env: Read-only file
# system" mid-update). The privilege boundary for this unit is the sudoers
# rule + root-owned wrapper, not the mount sandbox.
[Service]
NoNewPrivileges=false
ProtectSystem=no
ReadWritePaths=/opt/siemcore-cascade
