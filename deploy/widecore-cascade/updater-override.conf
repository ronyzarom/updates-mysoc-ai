# A drop-in for the updater's unit on a widecore host. The enroll script
# installs it as /etc/systemd/system/<the updater's unit>.d/override.conf.
#
# The updater installs and updates widecore by running one command through
# sudo (/etc/sudoers.d/widecore-updater). The updater kit's unit is closed in
# two ways that stop that command:
#
# NoNewPrivileges=true makes sudo refuse to run at all.
#
# ProtectSystem=strict gives the unit a read-only view of the system. sudo
# changes the user and does not leave that view, so the install, although
# root, cannot write /etc/widecore, the unit file or the packages it needs.
# SIEMCore met this on a live server: the update stopped half way with
# "Read-only file system".
#
# What bounds the updater on this host is therefore the sudoers entry and the
# root-owned shim it names, which runs four phases of a checked release and
# nothing else, not the unit's sandbox.
[Service]
NoNewPrivileges=false
ProtectSystem=no
ReadWritePaths=/opt/widecore-cascade
