# MySoc platform updater — testing-dr-b.mysoc.ai (DR lab, cascade tier 1)
#
# Nominal STANDBY of the permanent DR lab in GCP project mysoc-dr-lab
# (me-west1-b, internal 10.208.0.3, public 34.165.254.130). Warm standby of
# -a: same artifact, same update_group=alpha. Its PostgreSQL is a streaming
# standby (read-only, pg_is_in_recovery()=t), so the artifact's updater/apply
# detects recovery and SKIPS migrations here; code sync, restart and the
# :8080 health gate still run (the backend serves /health healthy with
# dr.role=standby). The public name testing-dr.mysoc.ai floats here on
# failover.
#
# See deploy/enroll-testing-dr.sh for the host wiring and the enrolment order
# (observe first, set the group server-side, then switch to real).

server:
  url: https://updates.mysoc.ai
  # Operator platform key for the DR lab (operator id: testing-dr-mysoc-ai).
  # The live value is NOT committed — it lives on the host and in keys/
  # (gitignored). Same key as -a; the instance.id below is distinct.
  license_key: "PASTE-PLATFORM-KEY"
  timeout: 30s

instance:
  id: mysoc-testing-dr-b
  type: server
  product_tier: mysoc
  hostname: ""            # defaults to the OS hostname
  updater_version: 1.16.0.1

signing:
  # Production release-signing public key (key_id bbc4c0dbdcedc37e),
  # pinned 2026-10-26 (verify anytime:
  #   curl -s https://updates.mysoc.ai/api/v1/signing-key).
  public_key: "1f1aa11a80d6ac549a26bb25daac4798c42dd469138680e68f89832bd32e7f57"
  require: true

relay:
  # The mysoc tier always runs the relay listener (the binary enforces it).
  # testing-dr-siemcore (10.208.0.4) will enrol through the ACTIVE host's
  # relay. PENDING mysoc-ai answer (blocker D): the listen port and the
  # child's trust of the relay across an -a/-b failover (each host
  # self-provisions its own cert, so the names below differ between -a and
  # -b). :18443 is the documented canonical relay port; testing.mysoc.ai
  # uses :8443. The listener is inert until a siemcore child is enrolled.
  enabled: true
  listen: ":18443"
  cache_dir: /var/lib/mysoc-updater/relay-cache
  child_offline_after: 5m
  tls:
    hosts: ["testing-dr.mysoc.ai", "10.208.0.3", "34.165.254.130"]
    dir: /var/lib/mysoc-updater/relay-tls

heartbeat:
  interval: 60s
  jitter: 10s

simulation:
  # Start in OBSERVE: heartbeat + policy check only, no download, no apply,
  # no updater self-update. The first heartbeat creates the instance row
  # server-side in group=stable with auto-update ON, so we deliberately do
  # NOT install anything until the instance is moved to alpha. After the
  # server shows update_group=alpha, flip this to "real" and restart the
  # updater to take the alpha artifact through the executor below.
  mode: observe
  artifact_dir: /var/lib/mysoc-updater/artifacts
  state_file: /var/lib/mysoc-updater/state.json
  # REAL INSTALLS (active once mode=real): releases stage under
  # /opt/mysoc-cascade and are activated by the root wrapper
  # (/usr/local/sbin/mysoc-apply-update), which delegates to the artifact's
  # own updater/apply. On this STANDBY the entrypoint sees PostgreSQL in
  # recovery and skips migrations; it still syncs code, restarts the
  # services and health-gates :8080 (dr.role=standby) and :3000.
  executor: filesystem
  filesystem:
    install_root: /opt/mysoc-cascade
    restart_command: ["sudo", "/usr/local/sbin/mysoc-apply-update"]
    health_command: ["bash", "-c", "curl -fsS http://127.0.0.1:8080/health"]
    keep_releases: 3
    command_timeout: 300s

products:
  - name: mysoc
    # Fresh host: no app installed yet. 0.0.0 is older than any real release,
    # so once in alpha the cascade offers the highest alpha mysoc artifact.
    current_version: "0.0.0"
    channel: stable
