# Public /install/ location for updates.mysoc.ai — serves the one-command fresh
# install bootstrap and the updater kit tarball with NO license header, directly
# from nginx (so it never hits the license-gated Go catch-all
# /{product}/{version}/{filename}).
#
# This mirrors the existing `location ^~ /downloads/` alias already in the 443
# server block. Add it to that same server block (see deploy/nginx/README.md),
# then reload nginx. `^~` makes this prefix win over regex locations.
#
# Serves:
#   https://updates.mysoc.ai/install/mysoc-enroll.sh
#   https://updates.mysoc.ai/install/mysoc-updater-kit-<version>.tar.gz(.sha256)
#   https://updates.mysoc.ai/install/mysoc-updater-kit-latest.tar.gz(.sha256)

location = /install { return 301 /install/; }
location ^~ /install/ {
    alias /home/bitnami/updates-mysoc-ai/public/install/;
    autoindex off;
    default_type application/octet-stream;
    types {
        text/x-shellscript  sh;
        application/gzip     gz;
        text/plain          sha256;
    }
}
